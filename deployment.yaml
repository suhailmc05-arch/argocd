apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: new-argocd
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: suhailmc/shoplite-frontend:v1
        ports:
        - containerPort: 80

